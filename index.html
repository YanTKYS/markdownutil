<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  外部API・CDN等への通信を制限する。srcdocのiframe・window.open()で開いたプレゼン用
  ウィンドウ・印刷用のblob URLはこのポリシーを継承するため、スライド表示側にもそのまま効く。
  - 'unsafe-inline': スライド表示用ドキュメント（slide-preview.js）とMarpが生成する
    インラインの<script>/<style>に必要。
  - 'wasm-unsafe-eval': AnyDocのWASM実行に必要（eval/new Functionは許可しない）。
  - img-src: Markdownに書いた外部URLの画像は許可する（取得はこのCSPでは制限されない。
    docs/slides.md「外部通信について」参照）。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>MarkdownUtil</title>
<meta name="description" content="文書をブラウザ内でMarkdownへ変換し、編集・プレビュー・保存できる閉域環境向けツール">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="toolbar">
    <h1 class="app-title">MarkdownUtil</h1>
    <!-- 操作順（開く → 保存・コピー・Word出力 → クリア）に沿って3つのグループへ分ける。
         role="toolbar"ではなくrole="group"とし、Tabキーで順に移動できる従来の操作を保つ。
         表示位置はCSS（.toolbarのgrid）で決めるため、DOMはTab順（… → クリア → ヘルプ）で並べる。 -->
    <div class="toolbar-actions">
      <div class="toolbar-group" role="group" aria-label="ファイルの読み込み">
        <button id="open-btn" type="button" class="btn btn-primary">ファイルを開く</button>
        <input id="file-input" type="file" hidden>
      </div>
      <div class="toolbar-group" role="group" aria-label="保存・コピー・出力">
        <button id="save-btn" type="button" class="btn">Markdownを保存</button>
        <button id="copy-btn" type="button" class="btn">Markdownをコピー</button>
        <button id="word-export-btn" type="button" class="btn">Word出力</button>
      </div>
      <div class="toolbar-group" role="group" aria-label="編集内容の消去">
        <button id="clear-btn" type="button" class="btn btn-subtle">クリア</button>
      </div>
    </div>
    <div class="toolbar-help">
      <button id="help-btn" type="button" class="btn btn-subtle">? ヘルプ</button>
    </div>
    <p class="status-bar" id="status-bar" role="status" aria-live="polite">ファイルを開くか、Markdownをドラッグ&amp;ドロップしてください。</p>
  </header>

  <main class="panes">
    <section class="pane pane-editor" aria-label="Markdown編集領域">
      <div class="pane-header">
        <label for="editor" class="pane-label">Markdown</label>
      </div>
      <div class="editor-wrap" id="editor-drop-zone">
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          placeholder="ここにMarkdownを直接入力するか、上部の「ファイルを開く」またはドラッグ&amp;ドロップで文書を読み込んでください。"
        ></textarea>
        <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
          <span>ドロップして読み込み</span>
        </div>
      </div>
    </section>

    <section class="pane pane-preview" aria-label="プレビュー領域">
      <div class="pane-header pane-header-preview">
        <span class="pane-label">プレビュー</span>
        <div class="tab-list" role="tablist" aria-label="プレビュー切替">
          <button type="button" id="mode-doc-btn" class="tab is-active" role="tab" aria-selected="true">文書</button>
          <button type="button" id="mode-slide-btn" class="tab" role="tab" aria-selected="false">スライド</button>
        </div>
      </div>
      <!-- 主ヘッダ（.pane-header）の外に独立した行として置く（css/app.cssの.slide-toolbar参照）。 -->
      <div class="slide-toolbar" id="slide-toolbar" hidden>
        <span class="slide-status" id="slide-status" aria-live="polite"></span>
        <div class="toolbar-group" role="group" aria-label="スライドのテーマ">
          <label class="slide-toolbar-label" for="slide-theme-select">テーマ</label>
          <select id="slide-theme-select" class="select">
            <option value="default">default</option>
            <option value="gaia">gaia</option>
            <option value="uncover">uncover</option>
          </select>
        </div>
        <div class="toolbar-group" role="group" aria-label="スライドの出力">
          <button type="button" id="slide-export-html-btn" class="btn">HTML出力</button>
          <button type="button" id="slide-print-btn" class="btn">印刷</button>
          <button type="button" id="slide-present-btn" class="btn">プレゼン表示</button>
        </div>
      </div>
      <div class="preview-body">
        <div class="preview" id="preview" role="region" aria-label="Markdownプレビュー" tabindex="0"></div>
        <iframe class="slide-frame" id="slide-frame" title="スライドプレビュー" hidden></iframe>
      </div>
    </section>
  </main>

  <section class="presenter-view" id="presenter-view" aria-label="発表者ビュー">
    <div class="presenter-view__header">
      <span class="presenter-view__title">発表者ビュー</span>
      <span class="presenter-view__position" id="presenter-position" aria-live="polite">- / -</span>
      <button type="button" id="presenter-end-btn" class="btn btn-danger presenter-view__end-btn">終了</button>
    </div>
    <div class="presenter-view__slides">
      <div class="presenter-view__slide-box">
        <span class="presenter-view__slide-label">現在</span>
        <iframe id="presenter-current-frame" class="presenter-view__frame" title="現在のスライド"></iframe>
      </div>
      <div class="presenter-view__slide-box">
        <span class="presenter-view__slide-label">次</span>
        <iframe id="presenter-next-frame" class="presenter-view__frame" title="次のスライド"></iframe>
      </div>
    </div>
    <div class="presenter-view__notes">
      <div class="presenter-view__notes-label">スピーカーノート</div>
      <div class="presenter-view__notes-body" id="presenter-notes" aria-live="polite"></div>
    </div>
    <div class="presenter-view__controls">
      <button type="button" id="presenter-prev-btn" class="btn">← 前へ</button>
      <button type="button" id="presenter-next-btn" class="btn">次へ →</button>
    </div>
  </section>
</div>

<div class="help-overlay" id="help-overlay" hidden>
  <div class="help-dialog" id="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-header">
      <h2 class="help-title" id="help-title">MarkdownUtil ヘルプ</h2>
      <button type="button" id="help-close-btn" class="btn btn-subtle btn-icon" aria-label="ヘルプを閉じる">×</button>
    </div>
    <div class="tab-list help-tabs" role="tablist" aria-label="ヘルプの切替">
      <button type="button" id="help-tab-guide" class="tab is-active" role="tab" aria-selected="true">使い方</button>
      <button type="button" id="help-tab-markdown" class="tab" role="tab" aria-selected="false">Markdown</button>
      <button type="button" id="help-tab-marp" class="tab" role="tab" aria-selected="false">Marp</button>
      <button type="button" id="help-tab-presentation" class="tab" role="tab" aria-selected="false">プレゼン</button>
    </div>
    <div class="help-body">
      <div class="help-panel-guide" id="help-panel-guide"></div>
      <div class="help-panel-markdown" id="help-panel-markdown" hidden></div>
      <div class="help-panel-marp" id="help-panel-marp" hidden></div>
      <div class="help-panel-presentation" id="help-panel-presentation" hidden></div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
